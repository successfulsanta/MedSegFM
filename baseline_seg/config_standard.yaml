seed: 42
deterministic: true
device: auto
pre_clip_min: -200
pre_clip_max: 300

data:
  root_dir: preprocessed
  split_manifest: processed/manifests/cases_manifest.csv
  label_map_path: baseline_seg/label_map_example.json
  num_workers: 4
  cache_rate: 0.0

model:
  backbone: unet
  in_channels: 1
  num_classes: 16
  roi_size: [128, 128, 128]
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]

train:
  batch_size: 1
  grad_accum_steps: 1
  num_samples_per_volume: 2
  max_epochs: 300
  val_interval: 1
  early_stopping_patience: 40
  amp: true

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00001

scheduler:
  name: cosine
  t_max: 300
  eta_min: 0.000001

augment:
  flip_prob: 0.5
  rotate_prob: 0.2
  scale_prob: 0.2
  elastic_prob: 0.05
  noise_prob: 0.15
  rotate_range: [0.15, 0.15, 0.15]
  scale_range: [0.1, 0.1, 0.1]
  elastic_sigma_range: [4.0, 6.0]
  elastic_magnitude_range: [50.0, 100.0]
  noise_std: 0.02

loss:
  dice_weight: 1.0
  ce_weight: 1.0

infer:
  sw_batch_size: 1
  overlap: 0.5
  min_component_size: 30
  apply_postprocess: true

logging:
  output_dir: experiments
  experiment_name: standard_recipe
  tensorboard: true
  save_epoch_metrics_json: true

standard_recipe:
  recipe_name: medseg_standard_v1
  comparison_group: baseline_pretrain_adapter_prompt
  enforce: true
  notes: Keep this unchanged across fair-comparison experiments.
