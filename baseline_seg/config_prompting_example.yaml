seed: 42
deterministic: true
device: auto
pre_clip_min: -200
pre_clip_max: 300

data:
  root_dir: preprocessed
  split_manifest: processed/manifests/cases_manifest.csv
  label_map_path: baseline_seg/label_map_example.json
  num_workers: 4
  cache_rate: 0.0

model:
  backbone: unet
  in_channels: 1
  num_classes: 16
  roi_size: [128, 128, 128]
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]

train:
  batch_size: 1
  grad_accum_steps: 1
  num_samples_per_volume: 2
  max_epochs: 200
  val_interval: 1
  early_stopping_patience: 30
  amp: true

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00001

scheduler:
  name: cosine
  t_max: 200
  eta_min: 0.000001

augment:
  flip_prob: 0.5
  rotate_prob: 0.2
  scale_prob: 0.2
  elastic_prob: 0.05
  noise_prob: 0.15
  rotate_range: [0.15, 0.15, 0.15]
  scale_range: [0.1, 0.1, 0.1]
  elastic_sigma_range: [4.0, 6.0]
  elastic_magnitude_range: [50.0, 100.0]
  noise_std: 0.02

loss:
  dice_weight: 1.0
  ce_weight: 1.0

infer:
  sw_batch_size: 1
  overlap: 0.5
  min_component_size: 30
  apply_postprocess: true

logging:
  output_dir: experiments
  experiment_name: prompting_compare
  tensorboard: true
  save_epoch_metrics_json: true

pretraining:
  mode: supervised
  method: masked_recon
  pretrained_path: null
  freeze_backbone: false

adaptation:
  mode: full_ft
  pretrained_path: null
  freeze_backbone: false

prompting:
  mode: none              # none | spatial | text
  num_points: 3
  use_bboxes: true
  point_radius: 1
  text_embedding_dim: 8
  max_text_organs: 4
  train_prompt_level: full
  val_prompt_level: minimal
  inference_prompt_level: minimal   # none | minimal | full
  prompt_generation_strategy: from_ground_truth

standard_recipe:
  recipe_name: prompting_compare_v1
  comparison_group: no_spatial_text_prompt
  enforce: true
  notes: Keep all non-prompting sections fixed.
